<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>App Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage">
    <!-- Venstre side: info om prototypen -->
    <aside class="intro">
      <p class="eyebrow">Prototype</p>
      <h1>App prototype</h1>
      <p class="lead">Klik rundt i telefonen for at prøve appen, som om du havde den i hånden.</p>
    </aside>

    <!-- Telefonen -->
    <div class="phone" aria-label="Mobiltelefon med app">
      <div class="phone-btn phone-btn--action"></div>
      <div class="phone-btn phone-btn--vol-up"></div>
      <div class="phone-btn phone-btn--vol-down"></div>
      <div class="phone-btn phone-btn--power"></div>

      <div class="screen">
        <div class="status-bar">
          <span class="status-time" id="clock">9:41</span>
          <div class="dynamic-island"></div>
          <span class="status-icons">
            <!-- Signal -->
            <svg width="18" height="12" viewBox="0 0 18 12" aria-hidden="true"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
            <!-- Wifi -->
            <svg width="16" height="12" viewBox="0 0 16 12" aria-hidden="true"><path d="M8 2.2c2.3 0 4.4.9 6 2.4l1.2-1.3A10.4 10.4 0 0 0 8 .4 10.4 10.4 0 0 0 .8 3.3L2 4.6a8.6 8.6 0 0 1 6-2.4Zm0 3.6c1.3 0 2.5.5 3.4 1.3l1.2-1.3A6.7 6.7 0 0 0 8 4a6.7 6.7 0 0 0-4.6 1.8l1.2 1.3c.9-.8 2.1-1.3 3.4-1.3Zm0 3.6c-.5 0-1 .2-1.3.5L8 11.4l1.3-1.5c-.3-.3-.8-.5-1.3-.5Z"/></svg>
            <!-- Batteri -->
            <span class="battery"><span class="battery-level"></span></span>
          </span>
        </div>

        <!-- Her bygger vi appen -->
        <div class="app" id="app">
          <div class="placeholder">
            <div class="placeholder-icon"></div>
            <h2>Appen kommer her</h2>
            <p>Dette område er "skærmen". Alt indhold i appen bygges inde i <code>#app</code>.</p>
          </div>
        </div>

        <div class="home-indicator"></div>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
